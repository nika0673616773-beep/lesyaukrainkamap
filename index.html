<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Географія подорожей Лесі Українки</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sand:#f2ead8;--parchment:#e8dcc8;--ink:#2a1f14;--brown:#6b3f1e;--rust:#b04a1c;--gold:#c8922a;--muted:#7a6550;--card-bg:#fdf7ee;--border:#c9aa82}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Montserrat',sans-serif;background:var(--sand);color:var(--ink);display:flex;flex-direction:column;height:100%}
.header{background:var(--ink);padding:18px 26px 14px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.hicon{font-size:26px}
.htitle h1{font-family:'EB Garamond',serif;font-size:22px;font-weight:400;color:#f5ede0;line-height:1.2}
.htitle p{font-size:10.5px;color:#a08c70;letter-spacing:.07em;text-transform:uppercase;margin-top:3px}
.hstats{margin-left:auto;display:flex;gap:20px}
.hstat-num{font-size:19px;font-weight:600;color:var(--gold);line-height:1;text-align:center}
.hstat-lbl{font-size:9px;color:#a08c70;text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-top:2px}
.layout{display:flex;flex:1;overflow:hidden;min-height:0}
.map-wrap{flex:1;position:relative;background:#c2dced;overflow:hidden;border-right:1px solid var(--border)}
.map-wrap svg{width:100%;height:100%;display:block}
.route-line{fill:none;stroke:var(--rust);stroke-width:1.8;stroke-dasharray:7 5;opacity:.5}
.pin-group{cursor:pointer}
.pin-group circle.bg{fill:var(--card-bg);stroke:var(--rust);stroke-width:2;transition:r .18s;r:13}
.pin-group:hover circle.bg{r:15}
.pin-group.active circle.bg{fill:var(--rust);stroke:var(--brown)}
.pin-group text.lbl{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:600;fill:var(--ink);pointer-events:none}
.map-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(253,247,238,.93);border:1px solid var(--border);border-radius:20px;padding:4px 13px;font-size:10.5px;color:var(--muted);white-space:nowrap;pointer-events:none}
.sidebar{width:315px;flex-shrink:0;background:var(--card-bg);display:flex;flex-direction:column;overflow:hidden}
.stabs{display:flex;background:#f5edd8;border-bottom:1px solid var(--parchment);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:8px 10px;font-size:10.5px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .13s;white-space:nowrap;font-family:'Montserrat',sans-serif}
.stab:hover{color:var(--brown)}
.stab.active{color:var(--rust);border-bottom-color:var(--rust);font-weight:600}
.scontent{flex:1;overflow-y:auto;padding:15px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.loc-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.loc-flag{font-size:24px}
.loc-name{font-family:'EB Garamond',serif;font-size:19px;font-weight:400;color:var(--ink)}
.loc-dates{font-size:10.5px;color:var(--muted);font-style:italic;margin-top:1px}
.badge{display:inline-block;font-size:9px;background:#f0e4cc;color:var(--brown);border:1px solid #d4b880;border-radius:10px;padding:2px 9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.loc-desc{font-size:11.5px;color:#4a3828;line-height:1.75;margin-bottom:13px;border-left:3px solid var(--parchment);padding-left:10px}
.sec{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.sec::after{content:'';flex:1;height:1px;background:var(--parchment)}
.work-item{display:flex;gap:7px;margin-bottom:5px;font-size:11.5px;line-height:1.45;font-family:'EB Garamond',serif;font-style:italic;color:var(--ink)}
.work-item::before{content:'✦';font-size:7px;color:var(--gold);margin-top:4px;flex-shrink:0;font-style:normal}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:13px}
.photo-tile{aspect-ratio:4/3;background:var(--parchment);border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.photo-tile span.e{font-size:32px}
.photo-tile .cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(30,18,8,.65));color:#f5ede0;font-size:9.5px;padding:10px 5px 4px;text-align:center;font-style:italic}
.tl-item{display:flex;gap:8px;position:relative}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:5px;top:13px;bottom:-8px;width:1px;background:var(--parchment)}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--rust);flex-shrink:0;margin-top:3px;border:2px solid var(--card-bg);outline:1px solid var(--rust)}
.tl-body{padding-bottom:9px}
.tl-date{font-size:9.5px;font-weight:600;color:var(--gold);margin-bottom:1px}
.tl-text{font-size:11px;color:var(--muted);line-height:1.5}
.quote-block{background:linear-gradient(135deg,#f8f0e0,#f0e6d0);border:1px solid #d4b880;border-radius:8px;padding:11px 13px;margin-top:13px}
.quote-text{font-family:'EB Garamond',serif;font-size:13px;font-style:italic;color:var(--ink);line-height:1.65;margin-bottom:5px}
.quote-attr{font-size:9.5px;color:var(--muted);text-align:right;font-weight:500}
</style>
</head>
<body>
<div class="header">
  <div class="hicon">🗺</div>
  <div class="htitle">
    <h1>Географія подорожей Лесі Українки</h1>
    <p>Маршрути · Місця · Твори · 1891 – 1910</p>
  </div>
  <div class="hstats">
    <div><div class="hstat-num">5</div><div class="hstat-lbl">країн</div></div>
    <div><div class="hstat-num">20+</div><div class="hstat-lbl">творів</div></div>
    <div><div class="hstat-num">19</div><div class="hstat-lbl">років</div></div>
  </div>
</div>
<div class="layout">
  <div class="map-wrap">
    <svg id="mapsvg" viewBox="200 60 650 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="wv" x="0" y="0" width="60" height="30" patternUnits="userSpaceOnUse">
          <path d="M0 15 Q15 8 30 15 Q45 22 60 15" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="900" height="600" fill="#b8d4e8"/>
      <rect width="900" height="600" fill="url(#wv)"/>
      <path d="M215,130 Q255,118 300,122 Q335,128 350,145 Q363,162 355,180 Q345,198 322,205 Q296,212 268,206 Q240,198 225,180 Q212,162 215,130Z" fill="#c4d89c" stroke="#a0bc70" stroke-width="0.6"/>
      <path d="M218,190 Q250,182 278,188 Q300,196 306,214 Q310,232 296,244 Q278,256 254,253 Q228,249 216,230 Q205,210 218,190Z" fill="#c4d89c" stroke="#a0bc70" stroke-width="0.6"/>
      <path d="M268,108 Q290,98 314,102 Q332,108 338,122 Q342,136 330,146 Q315,156 294,152 Q274,147 263,132 Q254,118 268,108Z" fill="#c4d89c" stroke="#a0bc70" stroke-width="0.6"/>
      <path d="M316,78 Q350,62 388,68 Q414,75 420,94 Q424,113 408,126 Q388,138 362,134 Q336,128 322,110 Q310,94 316,78Z" fill="#c4d89c" stroke="#a0bc70" stroke-width="0.6"/>
      <path d="M330,130 Q390,112 455,118 Q505,125 528,145 Q548,162 545,185 Q540,208 515,220 Q485,232 450,228 Q415,223 386,210 Q355,196 338,176 Q322,155 330,130Z" fill="#c4d89c" stroke="#a0bc70" stroke-width="0.6"/>
      <path d="M398,210 Q418,204 434,212 Q448,222 452,242 Q455,262 443,278 Q428,292 410,290 Q392,287 382,270 Q373,252 378,234 Q384,216 398,210Z" fill="#c4d89c" stroke="#a0bc70" stroke-width="0.6"/>
      <path d="M490,98 Q580,80 668,88 Q730,96 768,118 Q798,138 802,164 Q804,190 784,210 Q758,230 722,235 Q682,240 642,230 Q600,218 566,200 Q530,182 510,158 Q492,136 490,114Z" fill="#c4d89c" stroke="#a0bc70" stroke-width="0.6"/>
      <path d="M608,196 Q626,190 644,195 Q658,202 660,216 Q661,230 647,237 Q630,244 614,238 Q599,230 598,215 Q597,202 608,196Z" fill="#b4cc8c" stroke="#8ca860" stroke-width="1"/>
      <ellipse cx="622" cy="186" rx="56" ry="18" fill="#90b8d4" opacity="0.7"/>
      <path d="M662,188 Q688,180 714,186 Q732,193 736,208 Q738,224 724,232 Q706,240 686,235 Q666,228 660,212 Q655,198 662,188Z" fill="#b4cc8c" stroke="#8ca860" stroke-width="1"/>
      <ellipse cx="440" cy="264" rx="115" ry="32" fill="#96bcd8" opacity="0.55"/>
      <path d="M274,290 Q340,272 430,278 Q500,284 555,300 Q598,314 608,338 Q614,360 596,378 Q572,396 534,400 Q490,404 444,394 Q395,382 350,362 Q305,342 278,316 Q256,292 274,290Z" fill="#d4c490" stroke="#b8a870" stroke-width="0.6"/>
      <path d="M565,292 Q608,282 650,288 Q682,296 692,318 Q700,340 686,358 Q668,376 640,380 Q608,384 580,372 Q554,358 548,334 Q542,310 565,292Z" fill="#ccc080" stroke="#a8a050" stroke-width="0.8"/>
      <polyline class="route-line" points="624,218 440,236 412,258 622,334 700,210 624,218"/>
      <g class="pin-group active" id="pin-crimea" onclick="sel('crimea')" transform="translate(624,218)">
        <circle cx="0" cy="3" r="14" fill="rgba(0,0,0,0.1)"/>
        <circle class="bg" cx="0" cy="0"/>
        <text x="-9" y="7" font-size="14">🏖</text>
        <text class="lbl" x="16" y="-10">Крим</text>
      </g>
      <g class="pin-group" id="pin-germany" onclick="sel('germany')" transform="translate(438,152)">
        <circle cx="0" cy="3" r="14" fill="rgba(0,0,0,0.1)"/>
        <circle class="bg" cx="0" cy="0"/>
        <text x="-9" y="7" font-size="14">🏛</text>
        <text class="lbl" x="16" y="-10">Берлін</text>
      </g>
      <g class="pin-group" id="pin-italy" onclick="sel('italy')" transform="translate(412,252)">
        <circle cx="0" cy="3" r="14" fill="rgba(0,0,0,0.1)"/>
        <circle class="bg" cx="0" cy="0"/>
        <text x="-9" y="7" font-size="14">🌺</text>
        <text class="lbl" x="16" y="-10">Сан-Ремо</text>
      </g>
      <g class="pin-group" id="pin-egypt" onclick="sel('egypt')" transform="translate(622,330)">
        <circle cx="0" cy="3" r="14" fill="rgba(0,0,0,0.1)"/>
        <circle class="bg" cx="0" cy="0"/>
        <text x="-9" y="7" font-size="14">🏜</text>
        <text class="lbl" x="16" y="-10">Єгипет</text>
      </g>
      <g class="pin-group" id="pin-georgia" onclick="sel('georgia')" transform="translate(700,210)">
        <circle cx="0" cy="3" r="14" fill="rgba(0,0,0,0.1)"/>
        <circle class="bg" cx="0" cy="0"/>
        <text x="-9" y="7" font-size="14">⛰</text>
        <text class="lbl" x="16" y="-10">Тбілісі</text>
      </g>
    </svg>
    <div class="map-hint">Натисніть на мітку, щоб переглянути</div>
  </div>
  <div class="sidebar">
    <div class="stabs" id="stabs">
      <button class="stab active" data-id="crimea" onclick="sel('crimea')">🏖 Крим</button>
      <button class="stab" data-id="germany" onclick="sel('germany')">🏛 Берлін</button>
      <button class="stab" data-id="italy" onclick="sel('italy')">🌺 Сан-Ремо</button>
      <button class="stab" data-id="egypt" onclick="sel('egypt')">🏜 Єгипет</button>
      <button class="stab" data-id="georgia" onclick="sel('georgia')">⛰ Грузія</button>
    </div>
    <div class="scontent" id="scontent"></div>
  </div>
</div>
<script>
const D={crimea:{name:"Крим · Ялта",flag:"🇺🇦",badge:"Лікування & натхнення",dates:"1890-і — 1907 рр. (багаторазово)",desc:"Леся Українка неодноразово приїздила до Криму на лікування туберкульозу — теплий морський клімат давав тимчасове полегшення. Жила в Ялті, де зустрічалася з діячами культури. Кримська природа залишила глибокий слід у її ліриці.",quote:"Хотіла б я піснею стати у сюю хвилину ясну...",qfrom:"«Хотіла б я піснею стати»",works:["«Хотіла б я піснею стати...»","«Стояла я і слухала весну»","«Contra spem spero»","«Лісова пісня» (задум)","Цикл «Кримські спогади»"],photos:[{e:"🌊",c:"Ялтинське узбережжя"},{e:"🏔",c:"Гірські краєвиди"},{e:"🌸",c:"Весна в Криму"},{e:"🏡",c:"Дача в Ялті"}],tl:[{d:"1891",t:"Перший приїзд, лікування легень"},{d:"1897–98",t:"Тривале перебування, активна творчість"},{d:"1907",t:"Один із останніх візитів"}]},germany:{name:"Берлін · Нойєнар",flag:"🇩🇪",badge:"Клініки & культура",dates:"1899, 1901–1902 рр.",desc:"До Берліна та курортного Нойєнара Леся їздила на лікування в кращих клініках Європи. Попри виснажливі процедури, активно писала й відвідувала театри. Читала в оригіналі Гете та Шіллера.",quote:"Без надії таки сподіваюсь — душа зломана, але не скорена.",qfrom:"З листа до матері, Берлін 1901",works:["«Одержима» (1901)","«В катакомбах» (задуман тут)","Переклади з Гайне та Гете","«Осіння казка»","Листи як літературні документи"],photos:[{e:"🎭",c:"Берлінські театри"},{e:"💊",c:"Курорт Нойєнар"},{e:"📚",c:"Читання в пансіоні"},{e:"🌲",c:"Рейнські пейзажі"}],tl:[{d:"1899",t:"Перше лікування в Берліні"},{d:"1901",t:"«Одержима» написана за одну ніч"},{d:"1902",t:"Повернення через Відень"}]},italy:{name:"Сан-Ремо · Рим",flag:"🇮🇹",badge:"Середземне море",dates:"1902–1903 рр.",desc:"Леся приїхала до Сан-Ремо разом із Климентом Квіткою. Середземноморська природа й стародавні руїни стали для неї справжнім відкриттям. До Риму здійснювала короткі подорожі — тут народились яскраві драми на античні сюжети.",quote:"Тут море, сонце і вільне повітря — і я знову живу, а не лише існую.",qfrom:"З листа, Сан-Ремо 1903",works:["«Камінний господар» (задум)","«Руфін і Прісцілла»","«На руїнах» (цикл поезій)","«Орфеєве чудо»","Цикл «Середземне море»"],photos:[{e:"🌺",c:"Квіти Сан-Ремо"},{e:"🏺",c:"Римські руїни"},{e:"🌅",c:"Захід над морем"},{e:"🫒",c:"Оливкові гаї"}],tl:[{d:"Лист. 1902",t:"Прибуття до Сан-Ремо з К. Квіткою"},{d:"Зима 1903",t:"Поїздка до Риму, антична архітектура"},{d:"Весна 1903",t:"Повернення через Флоренцію"}]},egypt:{name:"Гелуан · Каїр",flag:"🇪🇬",badge:"Пустеля & філософія",dates:"Зима 1909–1910 рр.",desc:"У Єгипет Леся виїхала вже тяжко хворою — єгипетська зима вважалась ідеальною для легеневих хворих. Зупинялась у Гелуані поблизу Каїра. Пустеля й давня культура вразили її уяву — тут народились найфілософськіші твори.",quote:"Пустиня мовчить — і в тому мовчанні чути голос тисячоліть.",qfrom:"З щоденника, Гелуан 1909",works:["«Весна в Єгипті»","Єгипетський ліричний цикл","«У пустині»","«Іфігенія в Тавріді» (переклад Евріпіда)","«На полі крові» (завершено)"],photos:[{e:"🏜",c:"Єгипетська пустеля"},{e:"🐪",c:"Шлях до пірамід"},{e:"🌙",c:"Ніч у Гелуані"},{e:"⛵",c:"Ніл на світанку"}],tl:[{d:"Лист. 1909",t:"Прибуття до Гелуана, оренда вілли"},{d:"Груд. 1909",t:"Відвідини Каїра і пірамід Гізи"},{d:"Бер. 1910",t:"Повернення через Одесу"}]},georgia:{name:"Тбілісі · Кутаїсі",flag:"🇬🇪",badge:"Кавказ & перше кохання",dates:"1891, 1897–1898 рр.",desc:"До Грузії Леся вперше приїхала юною разом із дядьком Михайлом Драгомановим. Другий приїзд пов'язаний із коханням до Сергія Мержинського й активною творчою роботою на тлі кавказьких пейзажів.",quote:"Кавказ відкрив мені нові обрії — і душею, і очима.",qfrom:"З листа до сестри, 1897",works:["«Давня казка»","«Роберт Брюс» (переклад)","Цикл ліричних поезій «Хвилини»","«На крилах пісень»","Переклади з грузинської поезії"],photos:[{e:"🏔",c:"Кавказькі гори"},{e:"⛪",c:"Тбіліські церкви"},{e:"🌿",c:"Долина Кури"},{e:"🍇",c:"Грузинські виноградники"}],tl:[{d:"1891",t:"Перший приїзд, знайомство з Кавказом"},{d:"1897",t:"Зустріч з Мержинським у Тбілісі"},{d:"1898",t:"Повернення з новими рукописами"}]}};
function sel(id){
  document.querySelectorAll('.pin-group').forEach(p=>p.classList.remove('active'));
  document.getElementById('pin-'+id).classList.add('active');
  document.querySelectorAll('.stab').forEach(t=>t.classList.toggle('active',t.dataset.id===id));
  const d=D[id];
  document.getElementById('scontent').innerHTML=`<div class="loc-head"><div class="loc-flag">${d.flag}</div><div><div class="loc-name">${d.name}</div><div class="loc-dates">${d.dates}</div></div></div><div class="badge">${d.badge}</div><p class="loc-desc">${d.desc}</p><div class="sec">Твори</div><div style="margin-bottom:13px">${d.works.map(w=>`<div class="work-item">${w}</div>`).join('')}</div><div class="sec">Фотоальбом</div><div class="photos">${d.photos.map(p=>`<div class="photo-tile"><span class="e">${p.e}</span><div class="cap">${p.c}</div></div>`).join('')}</div><div class="sec">Хронологія</div><div style="margin-bottom:6px">${d.tl.map(t=>`<div class="tl-item"><div class="tl-dot"></div><div class="tl-body"><div class="tl-date">${t.d}</div><div class="tl-text">${t.t}</div></div></div>`).join('')}</div><div class="quote-block"><div class="quote-text">"${d.quote}"</div><div class="quote-attr">— ${d.qfrom}</div></div>`;
}
sel('crimea');
</script>
</body>
</html>
